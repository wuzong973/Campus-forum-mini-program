[server]
base_url = https://payun01.cn
bot_token = 6e6327db56653f678cf885622e3e34d4bbc5554e

[groups]
; 要发送的微信群名（企微搜索框里能搜到的名字），多个群用分隔符隔开
; 分隔符支持：英文逗号 ,  中文逗号 ，  顿号 、  分号 ;（用哪个都行）
; 示例：names = 广轻工校内论坛群1️⃣，广轻工校内论坛群2️⃣，广轻工论坛闲聊群
; 机器人以「运行它的电脑上登录的企微账号」身份发送：想换成谁发，就在那台电脑的企微里登录谁
; 群名必须和企微里显示的完全一致（含表情符号），最稳的做法是从企微搜索结果里复制
names = 广轻工校内论坛群


[timing]
; 轮询间隔（秒）；搜索结果等待秒数（网络慢就调大）
poll_seconds = 20
search_wait = 2.0
; 粘贴后兜底等待秒数（正常会自动检测输入框内容完整后才发送，读不到时才用它）
paste_wait = 1.2
