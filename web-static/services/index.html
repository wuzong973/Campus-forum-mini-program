<script>
(function () {
  var SERVICES = {
    water: {
      name: '订水系统',
      icon: '💧',
      url: 'http://wx.dingbaoxiaoyuan.com/home'
    },
    power: {
      name: '自助购电',
      icon: '⚡',
      url: 'https://payun01.cn/api/v1/power/selectservice'
    }
  };

  function $(id) { return document.getElementById(id); }

  function openOverlay(svc) {
    $('ov-icon').textContent = svc.icon;
    $('ov-title').textContent = '正在打开' + svc.name;
    $('ov-go').onclick = function () { window.location.href = svc.url; };
    $('ov-back').onclick = hideOverlay;
    $('overlay').classList.add('show');
  }
  function hideOverlay() { $('overlay').classList.remove('show'); }

  // 支持 ?service=water / power：从小程序点进来时自动跳转目标服务
  var match = location.search.match(/[?&]service=(water|power)(?:&|$)/);
  if (match) {
    var svc = SERVICES[match[1]];
    if (svc) {
      setTimeout(function () { window.location.href = svc.url; }, 600);
      openOverlay(svc);
    }
  }

  // 跳转失败（站点打不开）时用户按返回会回到本页，清掉等待层
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) hideOverlay();
  });
})();
</script>
