	window.parent.addEventListener("message", function (event) {
		if (event.data.type == "SNTL_FROM_HOST") {
			var ReturnText = event.data.text;
			if ("GetUserNameEx" == ReturnText.InvokeMethod) {
				if (0 == ReturnText.Status) {
					lastStatus = 0;
					if (dogNotPresent) {
						dogNotPresent = false;
						clearInfo();
					}
					return;
				}
				else {
					reportStatus(parseInt(ReturnText.Status));
					lastStatus = ReturnText.Status;
					if (false == dogNotPresent) {
						dogNotPresent = true;
					}
					return;
				}
			}
			else if ("GetDigestEx" == ReturnText.InvokeMethod) {
				if (0 == ReturnText.Status) {
					var stat;
					var dogID;
					var digest;
					dogID = ReturnText.DogIdStr;
					digest = ReturnText.DigestStr;

					stat = doAuth(dogID, digest);

					if (stat != 0) {
						reportStatus(stat);
						return;
					}
					else {
						loginajax();
					}

					return;
				}
				else {
					reportStatus(parseInt(ReturnText.Status));
					return;
				}
			}
			else {
				return;
			}
		}
	}, false);

	function checkDog()
	{
		var stat = "";
		var scope = "<dogscope/>";

		//Get Auth Code
		if ("" == authCode) {
			authCode = getAuthCode();
		}

		//Get object
		objAuth = getAuthObject();

		if ( (navigator.userAgent.indexOf("Chrome") > 0) || (navigator.userAgent.indexOf("Firefox") > 0) ) {
			objAuth.GetUserNameEx(scope, authCode);
		}
		else {
			//Open Dog
			stat = objAuth.Open(scope, authCode);
			if(0 != stat)
			{
				dogNotPresent = true;
				reportStatus(stat);
			}
			else
			{
				if (dogNotPresent == true)
				{
					dogNotPresent = false;
					window.location.href = "index.htmlx";
				}
			}
		}
		//Execute the check again after 2 seconds
		setTimeout(checkDog, 2000);
	}
	function validatedogLogin(dogpwd)
	{
		try {
			checkDog();
			var challenge = "";
			var stat = "";
			var objAuth = "";
			var dogID = "";
			var digest = "";
			var scope = "<dogscope/>";
			var authCode = "";

			var pwd = dogpwd;
			if(pwd.length<6 || pwd.length>16)
			{
				reportStatus(905);
				return false;
			}
			if(window.ActiveXObject || "ActiveXObject" in window) //IE
			{
				//Add onfocus event
				var obj = document.getElementById("userPassword");
				if (Object.hasOwnProperty.call(window, "ActiveXObject") && !window.ActiveXObject)
				{// is IE11
					obj.addEventListener("onfocus", clearInfo, false);
				}
				else
				{
					obj.attachEvent("onfocus", clearInfo);
				}
			}
			//Get Object
			objAuth = getAuthObject();

			//Get Auth Code
			if ("" == authCode) {
				authCode = getAuthCode();
			}

			if ( (navigator.userAgent.indexOf("Chrome") > 0) || (navigator.userAgent.indexOf("Firefox") > 0) ) {  //Chrome or Firefox

				//Get challenge string
				challenge = getChallenge();
				if(challenge.toString().length < 32)
				{
					if(challenge == "001")
					{
						reportStatus(916);
					}
					else if(challenge == "002")
					{
						reportStatus(917);
					}
					else
					{
						reportStatus(918);
					}
					return false;
				}

				//Generate digest
				objAuth.GetDigestEx(scope, authCode, pwd, challenge);

				return false;

			}
			//Open the dog
			stat = objAuth.Open(scope, authCode);
			if(stat != 0)
			{
				reportStatus(stat);
				return false;
			}

			//Verify the password
			stat = objAuth.VerifyUserPin(pwd);
			if(stat != 0)
			{
				objAuth.Close();
				reportStatus(stat);
				return false;
			}

			//Get the DogID
			stat = objAuth.GetDogID();
			if(stat != 0)
			{
				objAuth.Close();
				reportStatus(stat);
				return false;
			}

			//Save the DogID
			dogID = objAuth.DogIdStr;

			challenge = getChallenge();
			if(challenge.toString().length < 32)
			{
				if(challenge == "001")
				{
					reportStatus(916);
				}
				else if(challenge == "002")
				{
					reportStatus(917);
				}
				else
				{
					reportStatus(918);
				}
				window.objAuth.Close();
				return false;
			}

			//Generate digest
			stat = objAuth.GetDigest(challenge);
			if(stat != 0)
			{
				objAuth.Close();
				reportStatus(stat);
				return false;
			}

			digest = objAuth.DigestStr;

			//Do authenticate
			stat = doAuth(dogID, digest);
			if(stat != 0)
			{
				objAuth.Close();
				reportStatus(stat);
				return false;
			}

			objAuth.Close();
			return true;
		}catch (e) {
			alert("请安装加密狗插件，插入加密狗！")
			return  false;
		}
	}
	function loginajax()
	{

		var strUrl = "/Logon.do?method=logon&flag=sess";

		$.ajax( {
			url:strUrl,
			type:"post",
			cache:false,
			dataType:"text",
			success:function(dataStr) {
				if(dataStr=="no"){
					return false;
				}else{
					var scode=dataStr.split("#")[0];
					var sxh=dataStr.split("#")[1];
					var code=document.getElementById("userAccount").value+"%%%"+document.getElementById("userPassword").value;
					var encoded="";
					for(var i=0;i<code.length;i++){
						if(i<20){
							encoded=encoded+code.substring(i,i+1)+scode.substring(0,parseInt(sxh.substring(i,i+1)));
							scode = scode.substring(parseInt(sxh.substring(i,i+1)),scode.length);
						}else{
							encoded=encoded+code.substring(i,code.length);
							i=code.length;
						}
					}
					document.getElementById("encoded").value=encoded;
					if("logon"!="logonLdap"){
						document.getElementById("userPassword").value="";
						document.getElementById("userAccount").value="";
					}
					document.getElementById("loginForm").submit();
				}
			},
			error:function() {
				alert("计算异常！");
			}
		});
	}

    var isCapital = -1;
    jQuery(window).keyup(changeCapsLock);
    jQuery('input[name=userPassword]').on('keyup', function(e){
        if (e.keyCode==13){
            login();
        }
        var lastVal = '';
        lastVal = jQuery(this).val().substr(getCursortPosition.call(this,this)-1, 1).charCodeAt(0);
        var a2=String.fromCharCode(lastVal).toUpperCase().charCodeAt();//输入的字母大写对应的ascll值
        if (e.keyCode >= 65 && e.keyCode <= 90) {
            lastVal = jQuery(this).val().substr(getCursortPosition.call(this,this)-1, 1).charCodeAt(0);
            if ((e.shiftKey&&(lastVal>=65&&lastVal<=90))||(lastVal>=65&&lastVal<=90)) {
                if(e.shiftKey ){
                    isCapital = 0;
                }else{
                    isCapital = 1;
                }
                tipsCapsLock3.call(this);
            }else{
                if(lastVal>90&&!(e.shiftKey)){
                    isCapital = 0;
                }else {
                    isCapital = 1;
				}
                tipsCapsLock4.call(this);
            }
        }else{
            changeCapsLock.call(this, e);
        }
    });
    function changeCapsLock(e){
        e.stopPropagation();
        if (e.keyCode != 20||(document.getElementById("userPassword").value.length==0)){
            return;
        }else{
            switch(isCapital){
                case -1:
                    isCapital=1;
                    tipsCapsLock.call(this,this);
                    if (this !== window) tipsCapsLock.call(this);
                    break;
                case 0:
                    isCapital = 1;
                    tipsCapsLock.call(this,this);
                    if (this !== window) tipsCapsLock.call(this);
                    break;
                case 1:
                    isCapital = 0;
                    tipsCapsLock2.call(this,this);
                    if (this !== window) tipsCapsLock2.call(this);
                    break;
            }
        }
    }

    function tipsCapsLock4(){
        document.getElementById("text1").innerText="";

    }


    function getCursortPosition (ctrl) {
        var CaretPos = 0;
        if (document.selection) {
            ctrl.focus();
            var Sel = document.selection.createRange ();
            Sel.moveStart('character', -ctrl.value.length);
            CaretPos = Sel.text.length;
        }
        else if (ctrl.selectionStart || ctrl.selectionStart == '0')
            CaretPos = ctrl.selectionStart;
        return (CaretPos);
    }
