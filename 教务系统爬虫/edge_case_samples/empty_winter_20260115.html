<iframe name="hideFrame"  id="hideFrame" style="display:none"></iframe>
<style>
	#tooltip{position:absolute;z-index:9999;display:none;padding:4px 8px;border:1px solid rgba(255,255,255,0.25);border-radius:3px;background-color:#333333;filter:alpha(Opacity=80); opacity: 0.8;color:#fff;text-align:left;font-size:16px;}
	#tooltip:before{position:absolute;top:-6px;left:15px;width:0;height:0;border:6px dashed #333333;border-top:0;color:#fff;content:' ';line-height:0;border-bottom-style:solid;border-left-color:transparent;border-right-color:transparent;}
</style>
<script type="text/javascript">
	
	$("#li_showWeek").html("当前登录已失效，请重新登录！");
	
	
	
	$("#li_showWeek").html("<span class=\"main_text main_color\">当前日期不在教学周历内</span>");
	
	
	

	$(function(){
		var x=-15;//title显示层x轴偏移量
		var y=30;//title显示层y轴偏移量
		$("p").mouseover(function(e){//
			// 对所有td元素增加鼠标移入移出事件 //edit by wangwei 2018.10.31 此处修改为对所有P标签增加移入移出事件
			this.myTitle=this.title;
			this.title="";
			if(this.myTitle != ""){
				var tooltip="<div id='tooltip'>"+this.myTitle+"</div>"; //创建DIV元素
				$("body").append(tooltip); //追加到文档中
				$("#tooltip").css({"top": (e.pageY+y) + "px","left": (e.pageX+x) + "px"}).show();     //设置X Y坐标， 并且显示
			}
		}).mouseout(function(){
			this.title=this.myTitle;
			$("#tooltip").remove(); //移除
		}).mousemove(function(e){
			$("#tooltip").css({"top": (e.pageY+y) + "px","left": (e.pageX+x) + "px"});
		})
	})

	





	function checkInfo(jx0408id,kssj,jssj){
		var shareUrl ="";

		var isyx = false;
		var  urlinfo = "/jsxsd/kbxx/isYxMeetingV2?jx0408id="+jx0408id+"&kssj="+kssj+"&jssj="+jssj;
		$.ajax({
			type : "GET",
			async:false,
			url : urlinfo,
			dataType: "json",
			success:function(text) {
				if(text!=null&&text!=""){
					shareUrl = text;
					isyx = true;
				}else{
					isyx = false;

				}
			},
			error:function() {
				isyx = false;
			}
		});
		if(!isyx){
			alert("课堂连接已失效！");
			parent.window.location.reload();
			return false;
		}else{
			window.open(shareUrl);
		}

	}
	function createMeeting(jx0408id,kcjc,kssj,jssj,rs){
		//判断有无连排课堂，有的话需要修改传入的开始结束时间

		document.Form1.target="hideFrame";
		window.Form1.action="/jsxsd/kbxx/creatMeetingV2?jx0408id="+jx0408id+"&kcjc="+kcjc+"&kssj="+kssj+"&jssj="+jssj+"&rs="+rs;
		window.Form1.submit();
	}

</script>
